name: CI

on:
  push:
    branches: [main]
  pull_request:

# cwb links only the client side of ceslib, so it builds the CES_CLIENT_ONLY
# subset (no server, LuaJIT, cesqt, or ces tests) on every platform. cwb's own
# cwb_core tests are server-free Qt logic, so ctest runs on all three OSes.

jobs:
  linux:
    name: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libboost-all-dev
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtmultimedia'
          cache: true
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCES_CLIENT_ONLY=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        # Homebrew Qt: built against the runner's SDK (the aqt binaries still
        # reference the AGL framework, removed from modern Xcode SDKs).
        run: brew install ninja boost qt
      - name: Configure
        # ICU on the linker path: static Boost.Log pulls in Boost.Regex.
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCES_CLIENT_ONLY=ON
          -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
          -DCMAKE_EXE_LINKER_FLAGS="-L$(brew --prefix icu4c)/lib"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - name: MSYS2 / MinGW64 toolchain + deps
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-qt6-multimedia
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCES_CLIENT_ONLY=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
