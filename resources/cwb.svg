    <stop offset="0" stop-color="#2a9455"/><stop offset="1" stop-color="#0c4022"/></linearGradient></defs>
  <rect width="512" height="512" rx="116" fill="url(#b)"/>
  <rect width="512" height="228" rx="116" fill="#ffffff" opacity="0.05"/>
  <g fill="none" stroke="#eef3e2" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"
     transform="translate(0 -14)">
